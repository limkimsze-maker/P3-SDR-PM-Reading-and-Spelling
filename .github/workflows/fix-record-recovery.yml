name: Prefer complete PM records

on:
  push:
    paths:
      - '.github/workflows/fix-record-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch record selection logic
        run: |
          python3 -c 'import base64; exec(base64.b64decode("").decode())'
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prefer most complete saved PM record for recovery [skip ci]"
          git push
