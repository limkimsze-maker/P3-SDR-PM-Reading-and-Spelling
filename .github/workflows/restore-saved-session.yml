name: Restore saved PM session from chart

on:
  push:
    paths:
      - '.github/workflows/restore-saved-session.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore saved record before opening fresh session
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("index.html"); s=p.read_text(encoding="utf-8"); a=s.index("function launchPupilSessionFromChart(rawName, key){"); b=s.index("\n\nprogressChartWrap.addEventListener", a); new=base64.b64decode("").decode(); p.write_text(s[:a]+new+s[b:], encoding="utf-8")'
      - name: Commit restored-session behaviour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore saved PM work when opening chart session [skip ci]"
          git push
