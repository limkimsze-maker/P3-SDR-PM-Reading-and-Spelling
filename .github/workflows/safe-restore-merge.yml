name: Safe restore merge PM records

on:
  push:
    paths:
      - '.github/workflows/safe-restore-merge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch restore/import to merge safely
        run: |
          python3 -c 'import base64; exec(base64.b64decode("").decode())'
      - name: Commit patched webpage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Teacher Records restore merge non-destructive [skip ci]"
          git push
