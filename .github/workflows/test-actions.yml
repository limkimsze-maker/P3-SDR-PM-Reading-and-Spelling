name: Patch chart test target

on:
  push:
    paths:
      - '.github/workflows/test-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point chart link at test area
        run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); old="  const card = document.getElementById(\"card\");\n  if(card) card.scrollIntoView({behavior:\"smooth\", block:\"start\"});"; new="  const testArea = document.querySelector(\".sessionSheet\");\n  if(testArea) testArea.scrollIntoView({behavior:\"smooth\", block:\"start\"});"; assert old in s, "Target snippet not found"; p.write_text(s.replace(old,new,1), encoding="utf-8")'
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Jump chart links directly to PM test area [skip ci]"
          git push
